name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Build a DMG artifact"
        required: false
        type: boolean
        default: true
      notarize:
        description: "Submit the signed DMG for Apple notarization"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Debug
        run: |
          xcodebuild \
            -project RufusX.xcodeproj \
            -scheme RufusX \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/RufusXDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  package:
    name: Package DMG
    runs-on: macos-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Developer ID certificate
        id: import-cert
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${P12_BASE64:-}" ]]; then
            echo "Developer ID certificate secret was not provided; package job will create an unsigned DMG."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/rufusx-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"

          echo "$P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare notarization API key
        id: notary-key
        if: inputs.notarize
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_NOTARY_KEY_P8_BASE64:-}" || -z "${APPLE_NOTARY_KEY_ID:-}" || -z "${APPLE_NOTARY_ISSUER_ID:-}" ]]; then
            echo "Notarization was requested, but notary API key secrets are incomplete."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/notary"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Package DMG
        env:
          DEVELOPMENT_TEAM: "${{ vars.DEVELOPMENT_TEAM || '33832Z66QU' }}"
          SIGN_IDENTITY: "${{ vars.SIGN_IDENTITY || 'Developer ID Application: doeshing Chen (33832Z66QU)' }}"
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          args=(--output-dir artifacts)

          if [[ "${{ steps.import-cert.outputs.signed }}" != "true" ]]; then
            echo "Developer ID certificate secret was not provided; creating an unsigned DMG artifact."
            args+=(--unsigned)
          fi

          if [[ "${{ inputs.notarize }}" == "true" ]]; then
            if [[ "${{ steps.import-cert.outputs.signed }}" != "true" ]]; then
              echo "Cannot notarize because the Developer ID certificate was not imported." >&2
              exit 1
            fi

            if [[ "${{ steps.notary-key.outputs.configured }}" != "true" ]]; then
              echo "Cannot notarize because notary API key secrets are incomplete." >&2
              exit 1
            fi

            args+=(--notarize)
          fi

          scripts/package_dmg.sh "${args[@]}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RufusX-DMG
          path: artifacts/*.dmg
          if-no-files-found: error
